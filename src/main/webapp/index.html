<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Web Application - CI/CD</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );

            padding: 30px;
        }

        .container {
            width: 900px;
            max-width: 100%;

            background: white;

            border-radius: 20px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            color: #0f172a;
            font-size: 40px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #2563eb;
            font-size: 20px;
            margin-bottom: 35px;
        }

        .student {
            background: #f1f5f9;

            border-left: 5px solid #2563eb;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 30px;

            text-align: left;
        }

        .student h2 {
            color: #1e3a8a;
            margin-bottom: 12px;
        }

        .student p {
            color: #334155;
            font-size: 17px;
            margin: 7px 0;
        }

        .technologies {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 25px;
        }

        .card {
            padding: 25px;

            background: #f8fafc;

            border-radius: 12px;

            border: 1px solid #e2e8f0;

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .card h3 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
        }

        .success {
            margin-top: 30px;

            background: #16a34a;

            color: white;

            padding: 15px;

            border-radius: 10px;

            font-weight: bold;

            font-size: 18px;
        }

        footer {
            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }

        @media (max-width: 700px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .technologies {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚀 Java Web Application</h1>

        <div class="subtitle">
            CI/CD Pipeline Demonstration
        </div>

        <div class="student">

            <h2>Student Details</h2>

            <p>
                <strong>Name:</strong> Sakshi Dubey
            </p>

            <p>
                <strong>Project:</strong> Java Web Application
            </p>

        </div>

        <div class="technologies">

            <div class="card">

                <div class="icon">📦</div>

                <h3>Maven</h3>

                <p>
                    Project Build
                </p>

            </div>


            <div class="card">

                <div class="icon">⚙️</div>

                <h3>Jenkins</h3>

                <p>
                    Continuous Integration
                </p>

            </div>


            <div class="card">

                <div class="icon">🌐</div>

                <h3>Tomcat</h3>

                <p>
                    Application Deployment
                </p>

            </div>

        </div>

        <div class="success">

            ✓ CI/CD Pipeline Successfully Deployed

        </div>

        <footer>

            GitHub • Maven • Jenkins • Apache Tomcat

        </footer>

    </div>

</body>

</html>
